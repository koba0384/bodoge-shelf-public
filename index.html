<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボドゲ棚</title>
<meta name="robots" content="noindex">
<style>
  :root{
    color-scheme:dark;
    --felt:#173430; --felt-deep:#0e2320; --shelf:#1f4540;
    --edge:#2f5f57; --paper:#f3ede0; --paper-dim:#c9c0ad;
    --brass:#e0a52e; --ink:#0a1917;
  }
  *{box-sizing:border-box}
  html{background:#173430}
  html,body{margin:0;padding:0}
  body{
    background:var(--felt);
    background-image:
      radial-gradient(circle at 18% 8%, rgba(255,255,255,.045), transparent 45%),
      radial-gradient(circle at 82% 92%, rgba(0,0,0,.32), transparent 55%);
    color:var(--paper);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 70px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{margin:0;font-size:28px;font-weight:800;letter-spacing:.2em;text-indent:.2em}
  .sub{margin:6px 0 0;font-size:11px;color:var(--paper-dim);letter-spacing:.12em}
  .counts{display:flex;gap:20px;font-size:11px;color:var(--paper-dim);letter-spacing:.08em}
  .counts b{display:block;font-size:22px;color:var(--brass);font-weight:800;letter-spacing:0;line-height:1.2}

  .toolbar{
    position:sticky;top:0;z-index:5;background:var(--felt);
    padding:12px 0 10px;margin-top:16px;display:flex;gap:8px;align-items:center;
    border-bottom:1px solid var(--edge);
  }
  input[type=search]{
    flex:1;min-width:0;background:var(--felt-deep);border:1px solid var(--edge);color:var(--paper);
    padding:9px 13px;border-radius:3px;font:inherit;font-size:14px;
  }
  input:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .tbtn{
    appearance:none;background:linear-gradient(#255049,#1c3f39);border:1px solid var(--edge);
    color:var(--paper);font:inherit;font-size:13px;padding:9px 13px;border-radius:3px;
    cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;
  }
  .tbtn[aria-expanded="true"],.tbtn.on{border-color:var(--brass);color:var(--brass)}
  .badge{background:var(--brass);color:var(--ink);border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px}
  .sortsel{
    appearance:none;background:var(--felt-deep);border:1px solid var(--edge);color:var(--paper);
    font:inherit;font-size:13px;padding:9px 6px;border-radius:3px;cursor:pointer;flex:0 0 auto;
  }

  .applied{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .applied:empty{display:none}
  .clear-all{appearance:none;background:none;border:0;color:var(--paper-dim);font:inherit;font-size:11px;cursor:pointer;text-decoration:underline;padding:4px}

  .chip{
    appearance:none;border:1px solid var(--edge);background:linear-gradient(#255049,#1c3f39);
    color:var(--paper);font:inherit;font-size:12px;padding:5px 12px;border-radius:999px;
    cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.45);white-space:nowrap;
  }
  .chip.on{
    background:linear-gradient(#f0bb4a,#d5981f);color:var(--ink);border-color:#f7d98a;font-weight:700;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 0 rgba(0,0,0,.4);
  }
  .chip.q{background:transparent;border-color:rgba(255,255,255,.16);color:var(--paper-dim);box-shadow:none;font-size:11px;padding:4px 10px}
  .chip.q.on{background:transparent;color:var(--brass);border-color:var(--brass);font-weight:600}

  .filters{margin-top:12px;padding:14px;border:1px solid var(--edge);border-radius:5px;background:rgba(0,0,0,.18)}
  .frow{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;margin-bottom:12px}
  .frow:last-child{margin-bottom:0}
  .frow[hidden]{display:none}
  .row-label{font-size:11px;letter-spacing:.14em;color:var(--paper-dim);min-width:76px;flex:0 0 76px}
  .row-body{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;align-items:center}
  .box{display:flex;gap:6px;flex-wrap:wrap;width:100%}
  .box.scroll{max-height:168px;overflow-y:auto;padding-right:4px}
  .more{appearance:none;background:none;border:0;color:var(--brass);font:inherit;font-size:11px;cursor:pointer;padding:6px 2px;text-decoration:underline}

  /* ---- ラベル（メカニクスと自分のタグ。同じ形で色だけ変える） ---- */
  .labels{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .labels em{
    font-style:normal;font-size:10px;line-height:1.6;border:1px solid rgba(255,255,255,.14);
    border-radius:2px;padding:2px 6px;color:var(--paper-dim);
  }
  .labels em.tag{border-color:rgba(224,165,46,.45);color:#e8c877}
  .labels em.np{border-color:rgba(224,165,46,.7);color:var(--brass);font-weight:700}

  .stars{color:var(--brass);font-size:12px;letter-spacing:1px;white-space:nowrap}
  .stars .off{color:rgba(255,255,255,.18)}
  .rate-line{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--paper-dim);margin-top:6px;align-items:center}

  /* ---- カード表示 ---- */
  .grid{margin-top:20px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .card{
    background:linear-gradient(var(--shelf),#1a3b36);border:1px solid var(--edge);border-radius:5px;
    padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 3px 0 rgba(0,0,0,.35);
    color:inherit;text-decoration:none;
  }
  .card:hover{border-color:var(--brass)}
  .card .top{display:flex;gap:11px;align-items:flex-start}
  .card .ph{width:72px;height:72px;flex:0 0 72px;border-radius:3px;object-fit:cover;background:var(--felt-deep);border:1px solid rgba(0,0,0,.4)}
  .card div.ph{display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--edge)}
  .card .meta{min-width:0;flex:1}
  .card .name{font-size:15px;font-weight:700;line-height:1.35;word-break:break-word}
  .specs{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;color:var(--paper-dim);margin-top:5px}
  .specs span::before{content:attr(data-k);color:var(--edge);margin-right:4px;font-size:10px}

  /* ---- リスト表示 ---- */
  .grid.list{display:block;margin-top:16px}
  .grid.list .card{
    flex-direction:row;align-items:flex-start;gap:11px;border-radius:0;border-left:0;border-right:0;
    border-top:0;box-shadow:none;background:none;padding:11px 2px;
  }
  .grid.list .card + .card{border-top:1px solid rgba(255,255,255,.08)}
  .grid.list .card:hover{border-color:rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
  .grid.list .top{display:contents}
  .grid.list .ph{width:56px;height:56px;flex:0 0 56px}
  .grid.list .name{font-size:14px}
  .grid.list .labels{margin-top:5px}

  .empty{margin-top:32px;padding:30px 20px;text-align:center;border:1px dashed var(--edge);border-radius:5px;color:var(--paper-dim);font-size:14px}
  footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--edge);font-size:11px;color:var(--paper-dim);line-height:1.9}
  footer a{color:var(--paper-dim)}

  @media (max-width:560px){
    .wrap{padding:14px 14px 50px}
    h1{font-size:20px;letter-spacing:.14em;text-indent:.14em}
    .counts{gap:12px;font-size:10px}
    .counts b{font-size:17px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
    .card{padding:9px;gap:6px}
    .card .top{flex-direction:column;gap:8px}
    .card .ph{width:100%;height:112px;flex:none}
    .grid.list .card{flex-direction:row}
    .grid.list .top{display:contents}
    .grid.list .ph{width:52px;height:52px;flex:0 0 52px}
    .row-label{min-width:62px;flex:0 0 62px}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>ボドゲ棚</h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="counts">
    <div>表示中<b id="cShown">0</b></div>
    <div>ぜんぶ<b id="cTotal">0</b></div>
  </div>
</header>

<div class="toolbar">
  <input type="search" id="q" placeholder="タイトルで検索">
  <select class="sortsel" id="sortSel" aria-label="並び替え">
    <option value="shelf">棚の順</option>
    <option value="name">名前順</option>
    <option value="fun">面白い順</option>
    <option value="short">短い順</option>
    <option value="new">新しい順</option>
  </select>
  <button class="tbtn" id="viewToggle" type="button">リスト</button>
  <button class="tbtn" id="filterToggle" type="button" aria-expanded="false">絞り込み<span class="badge" id="filterCount" hidden>0</span></button>
</div>

<div class="applied" id="applied"></div>

<div class="filters" id="filters" hidden>
  <div class="frow"><span class="row-label">面白さ</span><div class="row-body" id="fFun"></div></div>
  <div class="frow"><span class="row-label">人数</span><div class="row-body" id="fPlayers"></div></div>
  <div class="frow"><span class="row-label">時間</span><div class="row-body" id="fTime"></div></div>
  <div class="frow" id="rowTags"><span class="row-label">タグ</span><div class="row-body"><div class="box" id="fTags"></div></div></div>
  <div class="frow" id="rowMech">
    <span class="row-label">メカニクス</span>
    <div class="row-body">
      <div class="box" id="fMech"></div>
      <button class="more" id="mechMore" type="button" hidden></button>
    </div>
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden></div>

<footer id="foot"></footer>

</div>

/* 画像の置き場所。書き出しのときに決まる（ボドゲーマのCDN、または一緒に置いた images/） */
const IMG = DATA.imgbase !== undefined ? DATA.imgbase
          : "https://image-bodoge.cdn-hoobby.net/small_light(dw=auto,dh=220,cw=294,ch=220,da=l,ds=s,q=80,cc=FFFFFF)/";
const MECH_TOP = 8;

let filter = {q:"", fun:null, players:null, time:null, tags:new Set(), mechs:new Set()};
let listView = (DATA.view||"list")!=="card";
let mechExpanded = false;

const RATE_OPTS=[{l:"3以上",v:3},{l:"4以上",v:4},{l:"5のみ",v:5}];
const PLAYER_OPTS=[2,3,4,5,6,8];
const TIME_OPTS=[{l:"15分以内",v:15},{l:"30分以内",v:30},{l:"60分以内",v:60}];

function imgUrl(g){return /^https?:/i.test(g.image||"") ? g.image : IMG+(g.image||"");}
function labelsOf(g){return (g.tags||[]).concat(g.mechanics||[]);}

function chip(label,on,onClick,cls){
  const b=document.createElement("button");
  b.className="chip"+(on?" on":"")+(cls?" "+cls:"");
  b.type="button";
  b.textContent=label;
  b.setAttribute("aria-pressed",on?"true":"false");
  b.addEventListener("click",onClick);
  return b;
}

function matches(g){
  if(filter.q && g.title.toLowerCase().indexOf(filter.q)<0) return false;
  if(filter.fun!==null && !(g.fun && g.fun>=filter.fun)) return false;
  if(filter.players!==null && !(g.pmin<=filter.players && filter.players<=g.pmax)) return false;
  if(filter.time!==null && !(g.tmax!==null && g.tmax<=filter.time)) return false;
  let ok=true;
  filter.tags.forEach(t=>{if((g.tags||[]).indexOf(t)<0)ok=false;});
  filter.mechs.forEach(m=>{if((g.mechanics||[]).indexOf(m)<0)ok=false;});
  return ok;
}

/* ---- 並び替え ---- */
let sortKey="shelf";
function yearOf(g){const m=String(g.year||"").match(/\d{4}/); return m?+m[0]:0;}
function byName(a,b){return a.title.localeCompare(b.title,"ja");}
function sortGames(list){
  const a=list.slice();
  if(sortKey==="name")  a.sort(byName);
  else if(sortKey==="fun")   a.sort((x,y)=>((y.fun||0)-(x.fun||0))||byName(x,y));
  else if(sortKey==="short") a.sort((x,y)=>((x.tmax===null?99999:x.tmax)-(y.tmax===null?99999:y.tmax))||byName(x,y));
  else if(sortKey==="new")   a.sort((x,y)=>(yearOf(y)-yearOf(x))||byName(x,y));
  else return list;
  return a;
}

function stars(n){
  const el=document.createElement("span");
  el.className="stars";
  let s="";
  for(let i=1;i<=5;i++)s+=(i<=n?"★":"☆");
  el.textContent=s;
  return el;
}

function photo(g){
  const img=document.createElement("img");
  img.className="ph";img.src=imgUrl(g);img.alt="";img.loading="lazy";
  img.addEventListener("error",()=>{
    const fb=document.createElement("div");
    fb.className="ph";fb.textContent=g.title.charAt(0);
    img.replaceWith(fb);
  });
  return img;
}

function card(g){
  const a=document.createElement("a");
  a.className="card";
  a.href="https://bodoge.hoobby.net/games/"+g.slug;
  a.target="_blank";a.rel="noopener";

  const top=document.createElement("div");
  top.className="top";

  const meta=document.createElement("div");
  meta.className="meta";

  const name=document.createElement("div");
  name.className="name";name.textContent=g.title;

  const sp=document.createElement("div");
  sp.className="specs";
  [["人数",g.players],["時間",g.time],["年齢",g.age],["発売",g.year]].forEach(pair=>{
    if(!pair[1]||pair[1]==="－")return;
    const s=document.createElement("span");s.dataset.k=pair[0];s.textContent=pair[1];sp.append(s);
  });

  meta.append(name,sp);

  if(g.fun||g.diff){
    const rl=document.createElement("div");
    rl.className="rate-line";
    if(g.fun){const w=document.createElement("span");w.textContent="面白さ ";w.append(stars(g.fun));rl.append(w);}
    if(g.diff){const w=document.createElement("span");w.textContent="難易度 ";w.append(stars(g.diff));rl.append(w);}
    meta.append(rl);
  }

  const labels=document.createElement("div");
  labels.className="labels";
  if(g.unplayed){const e=document.createElement("em");e.className="np";e.textContent="未プレイ";labels.append(e);}
  (g.tags||[]).forEach(t=>{const e=document.createElement("em");e.className="tag";e.textContent=t;labels.append(e);});
  (g.mechanics||[]).forEach(m=>{const e=document.createElement("em");e.textContent=m;labels.append(e);});
  if(labels.children.length)meta.append(labels);

  top.append(photo(g),meta);
  a.append(top);
  return a;
}

function render(){
  const grid=document.getElementById("grid");
  const emptyEl=document.getElementById("empty");
  grid.className="grid"+(listView?" list":"");
  grid.textContent="";
  const shown=sortGames(DATA.games.filter(matches));
  shown.forEach(g=>grid.append(card(g)));
  emptyEl.hidden=shown.length>0;
  if(!shown.length)emptyEl.textContent="条件に合うゲームがありません。絞り込みを外してみてください。";
  document.getElementById("cShown").textContent=shown.length;
  document.getElementById("cTotal").textContent=DATA.games.length;
}

function mechUniverse(){
  const count={};
  DATA.games.forEach(g=>(g.mechanics||[]).forEach(m=>{count[m]=(count[m]||0)+1;}));
  return Object.keys(count).sort((a,b)=>count[b]-count[a]||a.localeCompare(b,"ja"));
}
function tagUniverse(){
  const count={};
  DATA.games.forEach(g=>(g.tags||[]).forEach(t=>{count[t]=(count[t]||0)+1;}));
  return Object.keys(count).sort((a,b)=>count[b]-count[a]||a.localeCompare(b,"ja"));
}
function countOf(key,value){
  return DATA.games.filter(g=>(g[key]||[]).indexOf(value)>=0).length;
}

function renderFilters(){
  const ff=document.getElementById("fFun");
  ff.textContent="";
  RATE_OPTS.forEach(o=>{
    ff.append(chip(o.l,filter.fun===o.v,()=>{filter.fun=filter.fun===o.v?null:o.v;refresh();},"q"));
  });

  const fp=document.getElementById("fPlayers");
  fp.textContent="";
  PLAYER_OPTS.forEach(n=>{
    fp.append(chip(n+"人",filter.players===n,()=>{filter.players=filter.players===n?null:n;refresh();},"q"));
  });

  const ft=document.getElementById("fTime");
  ft.textContent="";
  TIME_OPTS.forEach(o=>{
    ft.append(chip(o.l,filter.time===o.v,()=>{filter.time=filter.time===o.v?null:o.v;refresh();},"q"));
  });

  const tags=tagUniverse();
  const tb=document.getElementById("fTags");
  tb.textContent="";
  tags.forEach(t=>{
    tb.append(chip(t+" "+countOf("tags",t),filter.tags.has(t),()=>{
      filter.tags.has(t)?filter.tags.delete(t):filter.tags.add(t);refresh();
    },"q"));
  });
  document.getElementById("rowTags").hidden = tags.length===0;

  const all=mechUniverse();
  const ordered=[];
  filter.mechs.forEach(m=>{if(ordered.indexOf(m)<0)ordered.push(m);});
  all.forEach(m=>{if(ordered.indexOf(m)<0)ordered.push(m);});
  const mb=document.getElementById("fMech");
  mb.textContent="";
  (mechExpanded?ordered:ordered.slice(0,MECH_TOP)).forEach(m=>{
    mb.append(chip(m+" "+countOf("mechanics",m),filter.mechs.has(m),()=>{
      filter.mechs.has(m)?filter.mechs.delete(m):filter.mechs.add(m);refresh();
    },"q"));
  });
  mb.classList.toggle("scroll",mechExpanded);
  const more=document.getElementById("mechMore");
  more.hidden = ordered.length<=MECH_TOP;
  more.textContent = mechExpanded?"畳む":"すべて表示（"+ordered.length+"）";
  document.getElementById("rowMech").hidden = ordered.length===0;
}

function renderApplied(){
  const el=document.getElementById("applied");
  el.textContent="";
  const items=[];
  if(filter.fun!==null)items.push({l:"面白さ "+filter.fun+"以上",clear:()=>{filter.fun=null;}});
  if(filter.players!==null)items.push({l:filter.players+"人",clear:()=>{filter.players=null;}});
  if(filter.time!==null){
    const o=TIME_OPTS.filter(x=>x.v===filter.time)[0];
    items.push({l:o?o.l:filter.time+"分",clear:()=>{filter.time=null;}});
  }
  filter.tags.forEach(t=>items.push({l:t,clear:()=>{filter.tags.delete(t);}}));
  filter.mechs.forEach(m=>items.push({l:m,clear:()=>{filter.mechs.delete(m);}}));

  items.forEach(it=>{
    el.append(chip(it.l+" ×",true,()=>{it.clear();refresh();}));
  });
  if(items.length>1){
    const c=document.createElement("button");
    c.className="clear-all";c.type="button";c.textContent="ぜんぶ解除";
    c.addEventListener("click",()=>{
      filter.fun=null;filter.players=null;filter.time=null;
      filter.tags.clear();filter.mechs.clear();mechExpanded=false;refresh();
    });
    el.append(c);
  }
  const badge=document.getElementById("filterCount");
  badge.textContent=items.length;
  badge.hidden=items.length===0;
}

function refresh(){renderFilters();renderApplied();render();}

document.getElementById("q").addEventListener("input",e=>{
  filter.q=e.target.value.trim().toLowerCase();render();
});
document.getElementById("sortSel").addEventListener("change",e=>{
  sortKey=e.target.value;
  render();
});
document.getElementById("viewToggle").addEventListener("click",e=>{
  listView=!listView;
  e.currentTarget.textContent=listView?"カード":"リスト";
  e.currentTarget.classList.toggle("on",listView);
  render();
});
document.getElementById("filterToggle").addEventListener("click",e=>{
  const panel=document.getElementById("filters");
  const open=panel.hidden;
  panel.hidden=!open;
  e.currentTarget.setAttribute("aria-expanded",open?"true":"false");
});
document.getElementById("mechMore").addEventListener("click",()=>{
  mechExpanded=!mechExpanded;renderFilters();
});

const vt=document.getElementById("viewToggle");
vt.textContent=listView?"カード":"リスト";
vt.classList.toggle("on",listView);
document.getElementById("sub").textContent=DATA.subtitle||"";
document.getElementById("foot").textContent=
  "更新: "+(DATA.generated_at||"")+" ／ ゲームの情報と画像はボドゲーマ（bodoge.hoobby.net）より";
refresh();
</script>
</body>
</html>
