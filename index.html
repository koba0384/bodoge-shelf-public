<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1311">
<title>ボドゲ棚</title>
<meta name="robots" content="noindex">
<style>
  :root{
    color-scheme:dark;
    --bg:#0f1311; --surface:#171d1a; --surface2:#1f2723; --surface3:#273129;
    --line:#2a332e; --line-soft:rgba(255,255,255,.07);
    --text:#eaeee9; --dim:#98a39c; --faint:#6f7a74;
    --accent:#e3a83a; --accent-soft:rgba(227,168,58,.13); --accent-line:rgba(227,168,58,.5);
    --ink:#141006;
    --r:12px;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.9);
    --side-w:250px;
  }
  *{box-sizing:border-box}
  html{background:var(--bg);-webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;
  }
  body.locked{overflow:hidden}
  [hidden]{display:none!important}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:99px;border:3px solid var(--bg)}

  .app{display:flex;align-items:flex-start;min-height:100vh}

  .side{
    width:var(--side-w);flex:0 0 var(--side-w);background:var(--surface);
    border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 16px 40px;
  }
  .brand{display:flex;gap:11px;align-items:center;margin-bottom:18px}
  .logo{
    width:38px;height:38px;flex:0 0 38px;border-radius:11px;
    background:linear-gradient(150deg,var(--accent),#a9721a);color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;
  }
  .brand h1{margin:0;font-size:16px;font-weight:800;letter-spacing:.07em}
  .brand .sub{margin:2px 0 0;font-size:11px;color:var(--faint)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
  .stats div{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
  .stats b{display:block;font-size:19px;color:var(--accent);font-weight:800;line-height:1.15}
  .stats span{font-size:10px;color:var(--faint);letter-spacing:.08em}

  .grp{margin-bottom:17px}
  .grp h3{margin:0 0 8px;font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--faint)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips.scroll{max-height:190px;overflow-y:auto;padding-right:2px}
  .chip{
    appearance:none;background:var(--surface2);border:1px solid var(--line);
    color:var(--dim);font-size:12px;padding:5px 11px;border-radius:99px;white-space:nowrap;
  }
  .chip:hover{background:var(--surface3);color:var(--text)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
  .chip.q{font-size:11px;padding:4px 9px;background:transparent}
  .chip.q.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
  .chip .n{opacity:.55;margin-left:5px;font-size:10px}
  .more{appearance:none;background:none;border:0;color:var(--accent);font-size:11px;padding:7px 2px 0;text-decoration:underline}
  .wide{width:100%;margin-top:6px;background:var(--surface2);border:1px solid var(--line);color:var(--dim);font-size:12px;padding:9px;border-radius:9px}
  .wide:hover{border-color:var(--accent-line);color:var(--accent)}
  .side-close{display:none}
  .scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.55);z-index:55}

  main{flex:1;min-width:0}
  .topbar{
    position:sticky;top:0;z-index:30;
    background:rgba(15,19,17,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  }
  .icon{
    position:relative;appearance:none;background:var(--surface2);border:1px solid var(--line);
    color:var(--text);width:38px;height:38px;flex:0 0 38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
  }
  .icon:hover{border-color:var(--accent-line);color:var(--accent)}
  .icon .bars,.icon .bars::before,.icon .bars::after{display:block;width:15px;height:1.5px;background:currentColor;border-radius:2px}
  .icon .bars{position:relative}
  .icon .bars::before,.icon .bars::after{content:"";position:absolute;left:0}
  .icon .bars::before{top:-5px;width:15px}
  .icon .bars::after{top:5px;width:10px}
  .icon .badge{
    position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;
    background:var(--accent);color:var(--ink);border-radius:99px;font-size:10px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }
  .seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
  .seg button{appearance:none;background:none;border:0;color:var(--dim);font-size:14px;padding:6px 11px;border-radius:99px;line-height:1}
  .seg button[aria-selected="true"]{background:var(--accent);color:var(--ink);font-weight:700}
  .search{
    flex:1 1 190px;min-width:0;background:var(--surface2);border:1px solid var(--line);
    color:var(--text);padding:9px 13px;border-radius:10px;font-size:14px;
  }
  .search::placeholder{color:var(--faint)}
  .search:focus{border-color:var(--accent-line);outline:none}
  select.sortsel{
    appearance:none;background:var(--surface2);border:1px solid var(--line);color:var(--text);
    font-size:13px;padding:9px 26px 9px 11px;border-radius:10px;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 14px) 18px,calc(100% - 9px) 18px;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  }
  .break{display:none}

  .applied{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 16px 0}
  .applied:empty{display:none}
  .applied .chip{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
  .clear-all{appearance:none;background:none;border:0;color:var(--faint);font-size:11px;text-decoration:underline;padding:4px}
  .clear-all:hover{color:var(--accent)}

  .grid{display:grid;gap:12px;padding:14px 16px 60px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
  .card{
    appearance:none;text-align:left;padding:0;overflow:hidden;color:inherit;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    display:flex;flex-direction:column;transition:border-color .15s,transform .15s,box-shadow .15s;
  }
  .card:hover{border-color:var(--accent-line);transform:translateY(-2px);box-shadow:var(--shadow)}
  .cover{position:relative;width:100%;padding-top:74%;background:var(--surface2);overflow:hidden}
  .cover img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
  .cover .ph{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:var(--surface3)}
  .cover .flag{
    position:absolute;top:7px;left:7px;background:rgba(20,16,6,.82);color:var(--accent);
    font-size:10px;font-weight:700;padding:3px 7px;border-radius:99px;border:1px solid var(--accent-line);
  }
  .card-b{padding:9px 10px 11px;display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
  .name{font-size:13px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sub2{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
  .meta{font-size:11px;color:var(--faint);display:flex;flex-wrap:wrap;gap:2px 8px}
  .stars{font-size:11px;letter-spacing:.5px;color:var(--accent);white-space:nowrap}
  .stars .off{color:var(--surface3)}
  .pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:3px;min-width:0}
  .pill{
    flex:0 0 auto;font-size:10px;line-height:1.5;padding:2px 6px;border-radius:5px;
    background:var(--accent-soft);color:var(--accent);border:1px solid rgba(227,168,58,.22);
    max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .pill.m{background:transparent;color:var(--faint);border-color:var(--line)}

  .grid.list{display:block;padding:6px 10px 60px}
  .grid.list .card{
    width:100%;flex-direction:row;align-items:center;gap:11px;border:0;border-radius:9px;
    border-bottom:1px solid var(--line-soft);padding:8px;background:none;
  }
  .grid.list .card:hover{transform:none;box-shadow:none;background:var(--surface2);border-bottom-color:transparent}
  .grid.list .cover{width:44px;height:44px;flex:0 0 44px;padding-top:0;border-radius:7px}
  .grid.list .cover .ph{font-size:17px}
  .grid.list .cover .flag{top:auto;bottom:-2px;left:-2px;font-size:0;padding:0;width:10px;height:10px;background:var(--accent);border-color:var(--surface);border-width:2px}
  .grid.list .card-b{padding:0;gap:2px}
  .grid.list .name{-webkit-line-clamp:1;font-size:13.5px}
  .grid.list .sub2{flex:0 0 auto;flex-direction:row;align-items:center;gap:9px;flex-wrap:nowrap;overflow:hidden}
  .grid.list .meta{flex:0 0 auto;white-space:nowrap}
  .grid.list .pills{margin:0;padding:0;flex-wrap:nowrap;overflow:hidden}
  .grid.list .stars{flex:0 0 auto;font-size:10px}

  .empty{margin:40px 16px;padding:36px 22px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);color:var(--dim)}
  footer{padding:18px 16px 40px;font-size:11px;color:var(--faint);line-height:1.9;border-top:1px solid var(--line-soft);margin:0 16px}

  .sheet-wrap{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80}
  .sheet-scrim{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.62)}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;
    background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    padding:0 0 max(18px,env(safe-area-inset-bottom));
    animation:up .22s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes up{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
  .grab{width:38px;height:4px;border-radius:99px;background:var(--surface3);margin:9px auto 4px}
  .sheet-in{padding:8px 18px 4px}
  .sheet h2{margin:0;font-size:17px;font-weight:800;line-height:1.35}
  .d-head{display:flex;gap:14px;align-items:flex-start}
  .d-cover{position:relative;width:104px;height:104px;flex:0 0 104px;border-radius:10px;overflow:hidden;background:var(--surface2)}
  .d-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .d-cover .ph{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:var(--surface3)}
  .d-specs{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--dim);margin-top:7px}
  .d-specs b{color:var(--faint);font-size:10px;font-weight:600;margin-right:4px}
  .d-rate{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:9px;align-items:center}
  .sec{border-top:1px solid var(--line-soft);margin-top:16px;padding-top:14px}
  .sec h3{margin:0 0 9px;font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--faint)}
  .sheet .pill{max-width:none;white-space:normal;overflow:visible}
  .sheet-foot{display:flex;gap:8px;padding:14px 18px 4px;border-top:1px solid var(--line-soft);margin-top:16px}
  .btn{appearance:none;background:var(--surface2);border:1px solid var(--line);color:var(--dim);font-size:13px;padding:10px 16px;border-radius:10px}
  .btn:hover{border-color:var(--accent-line);color:var(--accent)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
  .btn.grow{flex:1}
  a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}

  @media (max-width:899px){
    .side{
      position:fixed;left:0;top:0;bottom:0;height:100%;z-index:60;width:min(300px,86vw);flex:none;
      transform:translateX(-100%);transition:transform .24s cubic-bezier(.2,.8,.3,1);
      box-shadow:14px 0 40px -20px #000;
    }
    body.side-open .side{transform:none}
    .side-close{
      display:flex;position:absolute;top:14px;right:12px;width:32px;height:32px;
      align-items:center;justify-content:center;background:var(--surface2);
      border:1px solid var(--line);border-radius:9px;color:var(--dim);font-size:16px;
    }
    .break{display:block;flex-basis:100%;height:0}
    .topbar{padding:9px 12px}
    .grid{padding:12px 12px 60px;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
    .applied{padding:9px 12px 0}
    .sheet-in{padding:8px 15px 4px}
    .sheet-foot{padding:14px 15px 4px}
  }
  @media (min-width:900px){
    #sideToggle{display:none}
    .scrim{display:none}
    .grid{grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px;padding:18px 18px 60px}
    .sheet{
      position:relative;margin:5vh auto;max-width:600px;max-height:90vh;
      border-radius:16px;border:1px solid var(--line);
      animation:pop .18s cubic-bezier(.2,.8,.3,1);
    }
    @keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
    .grab{display:none}
    .sheet-in{padding:18px 22px 4px}
    .sheet-foot{padding:14px 22px 4px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">

<aside class="side" id="side" aria-label="絞り込み">
  <button class="side-close" id="sideClose" type="button" aria-label="閉じる">✕</button>
  <div class="brand">
    <div class="logo">棚</div>
    <div><h1>ボドゲ棚</h1><p class="sub" id="sub"></p></div>
  </div>
  <div class="stats">
    <div><b id="cShown">0</b><span>表示中</span></div>
    <div><b id="cTotal">0</b><span>ぜんぶ</span></div>
  </div>
  <div class="grp"><h3>面白さ</h3><div class="chips" id="fFun"></div></div>
  <div class="grp"><h3>人数</h3><div class="chips" id="fPlayers"></div></div>
  <div class="grp"><h3>時間</h3><div class="chips" id="fTime"></div></div>
  <div class="grp" id="grpTags"><h3>タグ</h3><div class="chips" id="fTags"></div></div>
  <div class="grp" id="grpMech">
    <h3>メカニクス</h3>
    <div class="chips scroll" id="fMech"></div>
    <button class="more" id="mechMore" type="button" hidden></button>
  </div>
  <button class="wide" id="clearAll" type="button">絞り込みをぜんぶ解除</button>
</aside>

<div class="scrim" id="scrim" hidden></div>

<main>
  <div class="topbar">
    <button class="icon" id="sideToggle" type="button" aria-label="絞り込み">
      <span class="bars"></span><span class="badge" id="filterCount" hidden>0</span>
    </button>
    <input type="search" class="search" id="q" placeholder="タイトルで検索">
    <span class="break"></span>
    <select class="sortsel" id="sortSel" aria-label="並び替え">
      <option value="shelf">棚の順</option>
      <option value="name">名前順</option>
      <option value="fun">面白い順</option>
      <option value="short">短い順</option>
      <option value="new">新しい順</option>
    </select>
    <div class="seg" id="viewSeg">
      <button id="viewCard" type="button" aria-selected="true" aria-label="カード表示" title="カード表示">▦</button>
      <button id="viewList" type="button" aria-selected="false" aria-label="リスト表示" title="リスト表示">☰</button>
    </div>
  </div>

  <div class="applied" id="applied"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
  <footer id="foot"></footer>
</main>

</div>

<div class="sheet-wrap" id="detail" hidden>
  <div class="sheet-scrim" data-close="1"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="grab"></div>
    <div class="sheet-in">
      <div class="d-head">
        <div class="d-cover" id="dCover"></div>
        <div style="min-width:0;flex:1">
          <h2 id="dTitle"></h2>
          <div class="d-specs" id="dSpecs"></div>
          <div class="d-rate" id="dRate"></div>
        </div>
      </div>
      <div class="sec" id="dTagSec"><h3>タグ</h3><div class="pills" id="dTags"></div></div>
      <div class="sec" id="dMechSec"><h3>メカニクス</h3><div class="pills" id="dMech"></div></div>
    </div>
    <div class="sheet-foot">
      <button class="btn grow pri" id="dClose" type="button">閉じる</button>
      <a class="btn" id="dLink" href="#" target="_blank" rel="noopener">ボドゲーマで見る</a>
    </div>
  </div>
</div>

/* 画像の置き場所。書き出しのときに決まる（ボドゲーマのCDN、または一緒に置いた images/） */
const IMG = DATA.imgbase !== undefined ? DATA.imgbase
          : "https://image-bodoge.cdn-hoobby.net/small_light(dw=auto,dh=220,cw=294,ch=220,da=l,ds=s,q=80,cc=FFFFFF)/";
const MECH_TOP = 8;

let filter = {q:"", fun:null, players:null, time:null, tags:new Set(), mechs:new Set()};
let listView = (DATA.view||"list")!=="card";
let mechExpanded = false;
let sortKey = "shelf";

const RATE_OPTS=[{l:"3以上",v:3},{l:"4以上",v:4},{l:"5のみ",v:5}];
const PLAYER_OPTS=[2,3,4,5,6,8];
const TIME_OPTS=[{l:"15分以内",v:15},{l:"30分以内",v:30},{l:"60分以内",v:60}];

function $(id){return document.getElementById(id);}
function el(tag,cls,text){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(text!==undefined&&text!==null)e.textContent=text;
  return e;
}
function imgUrl(g){return /^https?:/i.test(g.image||"") ? g.image : IMG+(g.image||"");}

function chip(label,on,onClick,cls,count){
  const b=el("button","chip"+(on?" on":"")+(cls?" "+cls:""));
  b.type="button";
  b.append(document.createTextNode(label));
  if(count!==undefined&&count!==null)b.append(el("span","n",count));
  b.setAttribute("aria-pressed",on?"true":"false");
  b.addEventListener("click",onClick);
  return b;
}

function matches(g){
  if(filter.q && g.title.toLowerCase().indexOf(filter.q)<0) return false;
  if(filter.fun!==null && !(g.fun && g.fun>=filter.fun)) return false;
  if(filter.players!==null && !(g.pmin<=filter.players && filter.players<=g.pmax)) return false;
  if(filter.time!==null && !(g.tmax!==null && g.tmax<=filter.time)) return false;
  let ok=true;
  filter.tags.forEach(t=>{if((g.tags||[]).indexOf(t)<0)ok=false;});
  filter.mechs.forEach(m=>{if((g.mechanics||[]).indexOf(m)<0)ok=false;});
  return ok;
}

function yearOf(g){const m=String(g.year||"").match(/\d{4}/); return m?+m[0]:0;}
function byName(a,b){return a.title.localeCompare(b.title,"ja");}
function sortGames(list){
  const a=list.slice();
  if(sortKey==="name")  a.sort(byName);
  else if(sortKey==="fun")   a.sort((x,y)=>((y.fun||0)-(x.fun||0))||byName(x,y));
  else if(sortKey==="short") a.sort((x,y)=>((x.tmax===null?99999:x.tmax)-(y.tmax===null?99999:y.tmax))||byName(x,y));
  else if(sortKey==="new")   a.sort((x,y)=>(yearOf(y)-yearOf(x))||byName(x,y));
  else return list;
  return a;
}

function starsEl(n){
  const w=el("span","stars");
  for(let i=1;i<=5;i++)w.append(el("span",i<=n?"":"off","★"));
  return w;
}

function cover(g,cls){
  const box=el("div",cls||"cover");
  box.append(el("div","ph",g.title.charAt(0)));
  if(!g.image)return box;
  const img=document.createElement("img");
  img.alt="";img.loading="lazy";
  img.addEventListener("error",()=>{img.remove();});
  img.src=imgUrl(g);
  box.append(img);
  return box;
}

function card(g){
  const b=el("button","card");
  b.type="button";
  b.setAttribute("aria-label",g.title+" の詳細");
  b.addEventListener("click",()=>openDetail(g));

  const cv=cover(g);
  if(g.unplayed)cv.append(el("div","flag","未プレイ"));
  b.append(cv);

  const body=el("div","card-b");
  body.append(el("div","name",g.title));

  const sub=el("div","sub2");
  const meta=el("div","meta");
  if(g.players)meta.append(el("span",null,g.players));
  if(g.time)meta.append(el("span",null,g.time));
  if(meta.firstChild)sub.append(meta);
  if(g.fun)sub.append(starsEl(g.fun));

  const pills=el("div","pills");
  const tags=g.tags||[];
  tags.slice(0,3).forEach(t=>pills.append(el("span","pill",t)));
  if(tags.length>3)pills.append(el("span","pill","+"+(tags.length-3)));
  if(!tags.length)(g.mechanics||[]).slice(0,2).forEach(m=>pills.append(el("span","pill m",m)));
  sub.append(pills);

  body.append(sub);
  b.append(body);
  return b;
}

/* ---- 1件の詳細 ---- */
function openDetail(g){
  const cv=$("dCover");
  cv.textContent="";
  const c=cover(g,"d-cover");
  while(c.firstChild)cv.append(c.firstChild);

  $("dTitle").textContent=g.title;
  $("dLink").href="https://bodoge.hoobby.net/games/"+g.slug;

  const sp=$("dSpecs");
  sp.textContent="";
  [["人数",g.players],["時間",g.time],["年齢",g.age],["発売",g.year]].forEach(kv=>{
    if(!kv[1]||kv[1]==="－")return;
    const s=el("span");
    s.append(el("b",null,kv[0]),document.createTextNode(kv[1]));
    sp.append(s);
  });

  const rt=$("dRate");
  rt.textContent="";
  if(g.fun){const w=el("span");w.append(document.createTextNode("面白さ "),starsEl(g.fun));rt.append(w);}
  if(g.diff){const w=el("span");w.append(document.createTextNode("難易度 "),starsEl(g.diff));rt.append(w);}
  if(g.unplayed)rt.append(el("span","pill","未プレイ"));

  const tags=g.tags||[];
  $("dTagSec").hidden=!tags.length;
  const tb=$("dTags");
  tb.textContent="";
  tags.forEach(t=>tb.append(el("span","pill",t)));

  const ms=g.mechanics||[];
  $("dMechSec").hidden=!ms.length;
  const mb=$("dMech");
  mb.textContent="";
  ms.forEach(m=>mb.append(el("span","pill m",m)));

  $("detail").hidden=false;
  document.body.classList.add("locked");
}
function closeDetail(){
  $("detail").hidden=true;
  document.body.classList.remove("locked");
}
$("dClose").addEventListener("click",closeDetail);
$("detail").addEventListener("click",ev=>{
  if(ev.target&&ev.target.getAttribute("data-close")==="1")closeDetail();
});
document.addEventListener("keydown",ev=>{
  if(ev.key!=="Escape")return;
  if(!$("detail").hidden){closeDetail();return;}
  if(document.body.classList.contains("side-open"))closeSide();
});

/* ---- 一覧 ---- */
function render(){
  const grid=$("grid");
  const emptyEl=$("empty");
  grid.className="grid"+(listView?" list":"");
  grid.textContent="";
  const shown=sortGames(DATA.games.filter(matches));
  const frag=document.createDocumentFragment();
  shown.forEach(g=>frag.append(card(g)));
  grid.append(frag);
  emptyEl.hidden=shown.length>0;
  if(!shown.length)emptyEl.textContent="条件に合うゲームがありません。絞り込みを外してみてください。";
  $("cShown").textContent=shown.length;
  $("cTotal").textContent=DATA.games.length;
}

function universe(key){
  const count={};
  DATA.games.forEach(g=>(g[key]||[]).forEach(v=>{count[v]=(count[v]||0)+1;}));
  return {list:Object.keys(count).sort((a,b)=>count[b]-count[a]||a.localeCompare(b,"ja")),count:count};
}

function renderFilters(){
  const ff=$("fFun");
  ff.textContent="";
  RATE_OPTS.forEach(o=>{
    ff.append(chip(o.l,filter.fun===o.v,()=>{filter.fun=filter.fun===o.v?null:o.v;refresh();},"q"));
  });

  const fp=$("fPlayers");
  fp.textContent="";
  PLAYER_OPTS.forEach(n=>{
    fp.append(chip(n+"人",filter.players===n,()=>{filter.players=filter.players===n?null:n;refresh();},"q"));
  });

  const ft=$("fTime");
  ft.textContent="";
  TIME_OPTS.forEach(o=>{
    ft.append(chip(o.l,filter.time===o.v,()=>{filter.time=filter.time===o.v?null:o.v;refresh();},"q"));
  });

  const tu=universe("tags");
  const tb=$("fTags");
  tb.textContent="";
  tu.list.forEach(t=>{
    tb.append(chip(t,filter.tags.has(t),()=>{
      filter.tags.has(t)?filter.tags.delete(t):filter.tags.add(t);refresh();
    },"q",tu.count[t]));
  });
  $("grpTags").hidden = tu.list.length===0;

  const mu=universe("mechanics");
  const ordered=[];
  filter.mechs.forEach(m=>{if(ordered.indexOf(m)<0)ordered.push(m);});
  mu.list.forEach(m=>{if(ordered.indexOf(m)<0)ordered.push(m);});
  const mb=$("fMech");
  mb.textContent="";
  (mechExpanded?ordered:ordered.slice(0,MECH_TOP)).forEach(m=>{
    mb.append(chip(m,filter.mechs.has(m),()=>{
      filter.mechs.has(m)?filter.mechs.delete(m):filter.mechs.add(m);refresh();
    },"q",mu.count[m]));
  });
  mb.classList.toggle("scroll",mechExpanded);
  const more=$("mechMore");
  more.hidden = ordered.length<=MECH_TOP;
  more.textContent = mechExpanded?"畳む":"すべて表示（"+ordered.length+"）";
  $("grpMech").hidden = ordered.length===0;
}

function clearFilters(){
  filter.fun=null;filter.players=null;filter.time=null;
  filter.tags.clear();filter.mechs.clear();mechExpanded=false;
}

function renderApplied(){
  const box=$("applied");
  box.textContent="";
  const items=[];
  if(filter.fun!==null)items.push({l:"面白さ "+filter.fun+"以上",clear:()=>{filter.fun=null;}});
  if(filter.players!==null)items.push({l:filter.players+"人",clear:()=>{filter.players=null;}});
  if(filter.time!==null){
    const o=TIME_OPTS.filter(x=>x.v===filter.time)[0];
    items.push({l:o?o.l:filter.time+"分",clear:()=>{filter.time=null;}});
  }
  filter.tags.forEach(t=>items.push({l:t,clear:()=>{filter.tags.delete(t);}}));
  filter.mechs.forEach(m=>items.push({l:m,clear:()=>{filter.mechs.delete(m);}}));

  items.forEach(it=>{
    const b=el("button","chip on",it.l+" ✕");
    b.type="button";
    b.setAttribute("aria-label",it.l+" の絞り込みを外す");
    b.addEventListener("click",()=>{it.clear();refresh();});
    box.append(b);
  });
  if(items.length>1){
    const c=el("button","clear-all","ぜんぶ解除");
    c.type="button";
    c.addEventListener("click",()=>{clearFilters();refresh();});
    box.append(c);
  }
  const badge=$("filterCount");
  badge.textContent=items.length;
  badge.hidden=items.length===0;
}

function refresh(){renderFilters();renderApplied();render();}

/* ---- 左の引き出し ---- */
function openSide(){
  document.body.classList.add("side-open");
  $("scrim").hidden=false;
}
function closeSide(){
  document.body.classList.remove("side-open");
  $("scrim").hidden=true;
}
$("sideToggle").addEventListener("click",()=>{
  document.body.classList.contains("side-open")?closeSide():openSide();
});
$("sideClose").addEventListener("click",closeSide);
$("scrim").addEventListener("click",closeSide);
$("clearAll").addEventListener("click",()=>{clearFilters();refresh();closeSide();});

$("q").addEventListener("input",e=>{
  filter.q=e.target.value.trim().toLowerCase();render();
});
$("sortSel").addEventListener("change",e=>{sortKey=e.target.value;render();});
function setView(isList){
  listView=isList;
  $("viewCard").setAttribute("aria-selected",isList?"false":"true");
  $("viewList").setAttribute("aria-selected",isList?"true":"false");
  render();
}
$("viewCard").addEventListener("click",()=>setView(false));
$("viewList").addEventListener("click",()=>setView(true));
$("mechMore").addEventListener("click",()=>{mechExpanded=!mechExpanded;renderFilters();});

$("sub").textContent=DATA.subtitle||"";
$("foot").textContent=
  "更新: "+(DATA.generated_at||"")+" ／ ゲームの情報と画像はボドゲーマ（bodoge.hoobby.net）より";
setView(listView);
refresh();
</script>
</body>
</html>
